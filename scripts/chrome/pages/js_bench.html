<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Alchemy JS bench</title>
<style>
body { font: 14px system-ui, sans-serif; margin: 16px; }
td, th { padding: 2px 10px; text-align: right; }
td:first-child, th:first-child { text-align: left; }
</style>
</head>
<body>
<h1 id="h">Alchemy JS bench</h1>
<p>Loop-heavy JavaScript kernels, run synchronously while the page loads, each timed with
<code>performance.now()</code>. <code>?scale=N</code> multiplies the work (default 1).
Every kernel also writes a checksum, which must be the same with and without the JIT.</p>
<table>
<thead><tr><th>kernel</th><th>ms</th><th>checksum</th></tr></thead>
<tbody id="results"></tbody>
<tfoot><tr><th>total</th><td id="r-total"></td><td id="c-total"></td></tr></tfoot>
</table>
<p id="status">not run</p>
<script>
"use strict";
(function () {
  // Work multiplier from ?scale=N (0 < N <= 100).
  var scale = 1;
  var match = /[?&]scale=([0-9.]+)/.exec(location.search);
  if (match) scale = Math.min(100, Math.max(0.01, parseFloat(match[1])));

  // xorshift32: deterministic inputs.
  function rng(seed) {
    var x = seed | 0 || 1;
    return function () { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return x >>> 0; };
  }
  function count(n) { return Math.max(1, Math.round(n * scale)); }

  // Integer loops: mixed arithmetic, shifts and a branch.
  function intLoops() {
    var n = count(3000000), s = 0, t = 1;
    for (var i = 0; i < n; i++) {
      s = (s + Math.imul(i, 7)) | 0;
      t = (t ^ (s >>> 3)) + (i & 15);
      if ((i & 1023) === 0) s = (s ^ t) | 0;
    }
    return (s ^ t) >>> 0;
  }

  // Float math: transcendental functions and a reduction.
  function floatMath() {
    var n = count(600000), a = 0, b = 1.5;
    for (var i = 1; i <= n; i++) {
      var x = i * 0.001;
      a += Math.sin(x) * Math.sqrt(x) + Math.cos(b) / (1 + x * x);
      b = b * 0.999 + 0.0007;
    }
    return Math.round(a * 1000) >>> 0;
  }

  // Object/property access with inline-cache churn: eight shapes through one site.
  function objects() {
    var shapes = [
      function (i) { return { a: i, b: 1 }; },
      function (i) { return { b: 2, a: i }; },
      function (i) { return { a: i, b: 3, c: 0 }; },
      function (i) { return { c: 0, a: i, b: 4 }; },
      function (i) { var o = { b: 5 }; o.a = i; return o; },
      function (i) { var o = Object.create(null); o.a = i; o.b = 6; return o; },
      function (i) { return { x: 0, y: 0, a: i, b: 7 }; },
      function (i) { return { a: i, b: 8, d: "s" }; }
    ];
    var pool = [], next = rng(7);
    for (var k = 0; k < 4096; k++) pool.push(shapes[next() & 7](k));
    var n = count(1500000), s = 0;
    for (var i = 0; i < n; i++) {
      var o = pool[i & 4095];
      s = (s + o.a * o.b) | 0;
      if ((i & 255) === 0) { o.a = (o.a + 1) | 0; pool[(i >>> 8) & 4095] = shapes[next() & 7](i); }
    }
    return s >>> 0;
  }

  // Array sort with a comparator.
  function arraySort() {
    var n = count(120000), next = rng(12345), data = new Array(n);
    for (var i = 0; i < n; i++) data[i] = next() % 1000003;
    data.sort(function (x, y) { return x - y; });
    var s = 0;
    for (var j = 0; j < n; j += 97) s = (Math.imul(s, 31) + data[j]) | 0;
    for (var k = 1; k < n; k++) if (data[k - 1] > data[k]) return 0;   // not sorted
    return s >>> 0;
  }

  // String building: concatenation, join, slicing and char codes.
  function strings() {
    var n = count(60000), parts = [], text = "";
    for (var i = 0; i < n; i++) {
      var piece = "k" + i.toString(36) + ":" + (i % 7);
      parts.push(piece);
      text += piece.charAt(piece.length - 1);
    }
    var joined = parts.join(","), s = joined.length;
    for (var j = 0; j < text.length; j++) s = (Math.imul(s, 33) + text.charCodeAt(j)) | 0;
    var pieces = joined.split(",");
    for (var k = 0; k < pieces.length; k += 13) s = (s ^ pieces[k].slice(1).length) | 0;
    return s >>> 0;
  }

  // Closure-heavy recursion: Takeuchi through closures, and fib through a memo-free closure.
  function closures() {
    function makeTak(counter) {
      return function tak(x, y, z) { counter.n++; return y >= x ? z : tak(tak(x - 1, y, z), tak(y - 1, z, x), tak(z - 1, x, y)); };
    }
    var counter = { n: 0 }, tak = makeTak(counter), r = 0, rounds = count(6);
    for (var i = 0; i < rounds; i++) r = (r + tak(18, 12, 6)) | 0;
    var fib = (function () { var self = function (n) { return n < 2 ? n : self(n - 1) + self(n - 2); }; return self; })();
    r = (r + fib(Math.min(30, 20 + Math.round(Math.log2(scale + 1) * 3)))) | 0;
    return (r ^ counter.n) >>> 0;
  }

  // Typed-array kernel: a sieve in a Uint8Array and a dot product over Float64Array.
  function typedArrays() {
    var n = count(1000000), sieve = new Uint8Array(n + 1), primes = 0;
    for (var i = 2; i <= n; i++) {
      if (sieve[i]) continue;
      primes++;
      for (var j = i * i; j <= n; j += i) sieve[j] = 1;
    }
    var m = count(200000), xs = new Float64Array(m), ys = new Float64Array(m), next = rng(99);
    for (var k = 0; k < m; k++) { xs[k] = (next() & 1023) / 64; ys[k] = (next() & 1023) / 128; }
    var dot = 0;
    for (var round = 0; round < 4; round++) for (var q = 0; q < m; q++) dot += xs[q] * ys[q];
    return (primes ^ Math.round(dot)) >>> 0;
  }

  var kernels = [
    ["int", intLoops], ["float", floatMath], ["objects", objects], ["sort", arraySort],
    ["string", strings], ["closure", closures], ["typed", typedArrays]
  ];
  var body = document.getElementById("results"), total = 0, checksum = 0;
  for (var index = 0; index < kernels.length; index++) {
    var name = kernels[index][0], started = performance.now(), value = kernels[index][1]();
    var ms = performance.now() - started;
    total += ms;
    checksum = (Math.imul(checksum, 31) + value) >>> 0;
    var row = document.createElement("tr");
    row.innerHTML = "<td>" + name + "</td><td id=\"r-" + name + "\">" + ms.toFixed(1) + "</td><td id=\"c-" + name + "\">" + value + "</td>";
    body.appendChild(row);
  }
  document.getElementById("r-total").textContent = total.toFixed(1);
  document.getElementById("c-total").textContent = String(checksum);
  document.getElementById("status").textContent = "done, scale " + scale;
  document.getElementById("h").setAttribute("data-js", "ran");
  document.body.dataset.done = "1";
})();
</script>
</body>
</html>
