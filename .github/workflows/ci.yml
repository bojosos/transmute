# Build and test on a GitHub-hosted Windows runner, in two configurations:
#
# * core: the default configuration. transmute, alchemy, their core suites and the
#   ARM64 PE and Mach-O fixtures that Visual Studio's Clang builds.
# * fx: -DTRANSMUTE_WITH_FX=ON adds the fx engine, alchemy-fx and the GUI providers.
#   The runner has no Vulkan SDK, so Metal builds without a device (its headless
#   shells) and the Vulkan-only tests are left out.
#
# The runner has no artifacts/ directory (guest LLVM, Swift and Expat runtimes,
# application roots), and CMake leaves out the tests that need it.
#
# * conformance: runs the conformance suites (scripts/conformance/README.md) under the fx
#   job's alchemy-fx and fails only on regressions against scripts/conformance/baseline/.
#   Pushes and pull requests run the tests the baseline expects to pass; the weekly run and runs
#   started by hand run every test.
#
# * linux: the Linux port (docs/ALCHEMY_HOST_LINUX.md) on a GitHub-hosted Ubuntu runner with
#   Clang 21, for both host backends. ALCHEMY_HOST=linux builds and runs the tests listed in
#   scripts/ci/linux_tests.txt (the ones correct on Linux today; that file says what is left
#   out and why) and alchemy_gui_host on Xvfb. ALCHEMY_HOST=null builds alchemy with the OS
#   headers poisoned and runs alchemy_host.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 3"

permissions:
  contents: read

# Per event, so a push to main does not cancel the weekly full run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (Release, ${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            cmake_options: ""
          - name: fx
            cmake_options: "-DTRANSMUTE_WITH_FX=ON"
    defaults:
      run:
        shell: powershell
    env:
      # GUI tests: no visible windows, no focus changes, no crash dialogs.
      ALCHEMY_GUI_CLOAK: "1"
      ALCHEMY_GUI_NO_ACTIVATE: "1"
      ALCHEMY_GUI_NO_CRASH_DIALOG: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: |
          . scripts/dev/build_env.ps1 -CacheDirectory "$env:RUNNER_TEMP\sccache"
          cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_CONFIGURATION_TYPES=Release ${{ matrix.cmake_options }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          . scripts/dev/build_env.ps1 -CacheDirectory "$env:RUNNER_TEMP\sccache"
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The conformance job runs its suites under this alchemy-fx (one self-contained executable).
      - name: Upload alchemy-fx for the conformance job
        if: matrix.name == 'fx'
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-fx
          retention-days: 1
          if-no-files-found: error
          path: build/Release/alchemy-fx.exe

      # A few core tests assert that worker threads overlap, which a loaded
      # machine can miss; a failing test gets up to three tries.
      - name: Test
        run: |
          ctest --test-dir build -C Release -j 2 --output-on-failure --timeout 900 --repeat until-pass:3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The Linux port. Clang 21 from apt.llvm.org (the code is built and tested with Clang 21; the
  # runner's own Clang is older), the distribution's -dev packages for the Linux host, ccache
  # between runs. Guest runs are cloaked and loopback-only, as on Windows.
  linux:
    name: Linux x64 (Release, ALCHEMY_HOST=${{ matrix.host }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: [linux, null]
    env:
      ALCHEMY_GUI_CLOAK: "1"
      ALCHEMY_GUI_NO_ACTIVATE: "1"
      ALCHEMY_GUI_NO_CRASH_DIALOG: "1"
      ALCHEMY_NETWORK: loopback
      # Skipped host-test area, with its reason:
      # power: logind's Inhibit needs a user session's polkit rights, which the runner's
      #   service account does not have (it passes in a desktop session).
      ALCHEMY_HOST_TEST_SKIP_AREAS: power
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v5

      - name: Install Clang 21 and the Linux host's packages
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          sudo apt-get update
          # The Linux host's libraries (cmake/AlchemyHost.cmake), GStreamer's headers (codecs are
          # loaded at run time), and for the tests: Xvfb, Mesa's lavapipe Vulkan driver, fonts.
          sudo apt-get install -y --no-install-recommends ninja-build ccache \
            libxcb1-dev libxcb-xkb-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-screensaver0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libpango1.0-dev libcairo2-dev libfreetype-dev libfontconfig-dev libharfbuzz-dev \
            libturbojpeg0-dev libpng-dev libtiff-dev libgif-dev \
            libcurl4-openssl-dev libssl-dev libpulse-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libvulkan-dev mesa-vulkan-drivers xvfb fonts-dejavu-core fonts-liberation

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.host }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.host }}-

      - name: Configure
        run: |
          llvm=/usr/lib/llvm-21/bin
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$llvm/clang -DCMAKE_CXX_COMPILER=$llvm/clang++ -DCMAKE_LINKER_TYPE=LLD \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DALCHEMY_CLANG=$llvm/clang -DALCHEMY_LD64_LLD=$llvm/ld64.lld \
            -DTRANSMUTE_WITH_FX=ON -DALCHEMY_HOST=${{ matrix.host }}

      - name: Build (null)
        if: matrix.host == 'null'
        run: cmake --build build --target alchemy alchemy_host_tests

      - name: Build (linux)
        if: matrix.host == 'linux'
        run: |
          python3 scripts/ci/linux_ctest.py build build scripts/ci/linux_tests.txt
          cmake --build build --target alchemy_gui_host

      - name: Test (null)
        if: matrix.host == 'null'
        run: ctest --test-dir build -R '^alchemy_host$' --output-on-failure --timeout 600

      - name: Test (linux)
        if: matrix.host == 'linux'
        run: python3 scripts/ci/linux_ctest.py test build scripts/ci/linux_tests.txt

      # alchemy_gui_host's window server, screens, cursors and input queries need an X server.
      - name: Test alchemy_gui_host (linux, Xvfb)
        if: matrix.host == 'linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" ctest --test-dir build -R '^alchemy_gui_host$' --output-on-failure --timeout 600

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  # Six open-source suites, built as SDK-free arm64 macOS programs the way conformance-macos.yml
  # builds them, run under the fx job's alchemy-fx. `conformance.py gate` fails the job only when a
  # test the baseline expects to pass fails three times in a row. Expected failures, XFAILs and
  # Alchemy-only failures do not; newly passing tests ask for a baseline update. Known-flaky tests
  # and tests a hosted runner cannot run honestly (GPU, network, timing) are listed in
  # scripts/conformance/ci.tsv and reported as flaky or skipped, never as passes.
  conformance:
    name: Conformance (alchemy-fx)
    needs: windows
    # Runs when the fx build succeeded, whatever the ctest results of either configuration.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Download alchemy-fx (from the fx job)
        uses: actions/download-artifact@v4
        with:
          name: alchemy-fx
          path: ${{ runner.temp }}/fx

      # The pinned upstream sources change only with sources.json; the cache spares the upstreams a
      # download on every push. fetch_sources.py verifies what it downloads and leaves cached
      # directories alone.
      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/conformance-sources
          key: conformance-sources-${{ hashFiles('scripts/conformance/sources.json') }}

      - name: Fetch sources (official upstreams, pinned content)
        run: |
          python -I scripts/conformance/fetch_sources.py --sources "$env:RUNNER_TEMP\conformance-sources"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build sysroot and suites
        # C++ tests need the guest libc++ from artifacts/, which the runner lacks; the gate skips them.
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\no-runtime" | Out-Null
          python -I scripts/conformance/build_sysroot.py --sources "$env:RUNNER_TEMP\conformance-sources" --out "$env:RUNNER_TEMP\conformance\sysroot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I scripts/conformance/conformance.py build all --sources "$env:RUNNER_TEMP\conformance-sources" --out "$env:RUNNER_TEMP\conformance" --runtime-dir "$env:RUNNER_TEMP\no-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --quick leaves out the tests the baseline expects to fail: they cannot regress, so the verdict
      # is the same. The full run (weekly, or by hand) also reports the ones that start passing.
      - name: Run suites under alchemy-fx and compare with the baselines
        env:
          QUICK: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          # The runner's file system settings that ci.tsv's skips name.
          cmd /c "fsutil behavior query disablelastaccess 2>&1"
          $scope = @(); if ($env:QUICK -eq 'true') { $scope = @('--quick') }
          python -I scripts/conformance/conformance.py gate all @scope --out "$env:RUNNER_TEMP\conformance" --alchemy "$env:RUNNER_TEMP\fx\alchemy-fx.exe" --runtime-dir "$env:RUNNER_TEMP\no-runtime" --jobs 4 --tsv "$env:RUNNER_TEMP\conformance\conformance-results.tsv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Results only (status, verdict and output tail of each test), no programs.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          retention-days: 14
          path: |
            ${{ runner.temp }}/conformance/conformance-results.tsv
            ${{ runner.temp }}/conformance/results
